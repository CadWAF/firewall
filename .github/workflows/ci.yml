name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: bpf2go build and unit tests
    runs-on: ubuntu-latest
    # Run CI only while the repository is public. The other CadWAF components
    # are private; this keeps Actions minutes from being spent on a private
    # mirror and matches the project's "public repo only" policy.
    if: ${{ !github.event.repository.private }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: go.sum

      - name: Install BPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev "linux-headers-$(uname -r)"

      - name: Generate BPF and build
        run: make generate && make build

      - name: Run tests
        run: go test ./... -count=1
