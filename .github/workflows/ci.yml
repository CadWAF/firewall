name: CI

# dev is the integration branch: every push to it, and every pull request
# toward dev or main, runs the test suite. Pushes to main are handled by the
# release workflow (which runs the same tests before it publishes), so main is
# intentionally not listed under push here.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: bpf2go build and unit tests
    runs-on: ubuntu-latest
    # Run CI only while the repository is public. The other CadWAF components
    # are private; this keeps Actions minutes from being spent on a private
    # mirror and matches the project's "public repo only" policy.
    if: ${{ !github.event.repository.private }}
    env:
      # This workflow deliberately uses NO third-party actions (no `uses:`), so
      # it passes under the CadWAF org policy that only permits actions owned by
      # the org. Checkout is a plain git fetch of the pushed/PR commit; Go is the
      # version preinstalled on the runner image.
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out ${{ github.sha }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Install BPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev "linux-headers-$(uname -r)"

      - name: Generate BPF and build
        run: |
          go version
          make generate && make build

      - name: Run tests
        run: go test ./... -count=1
